<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quanto você me conhece?</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a1226;--bg2:#4a1d3d;--ink:#fbeef0;--soft:#e9b8c6;--rose:#f08fa8;--gold:#e8c27a;--card:rgba(255,255,255,.08);--paper:#fff8f4;--paper-ink:#4a1d3d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg));color:var(--ink);font-family:Nunito,system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:28px 22px 40px;display:flex;flex-direction:column;justify-content:center;min-height:100vh;text-align:center}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;margin:0}
h1{font-size:46px;line-height:1.05;font-style:italic}
h2{font-size:29px;line-height:1.2}
p{line-height:1.5;color:var(--soft)}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.btn{margin-top:26px;padding:15px 30px;border-radius:999px;background:var(--rose);color:#3a0f2c;font-weight:600;font-size:17px}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hearts{display:flex;justify-content:center;gap:6px;margin:0 0 18px;min-height:22px}
.heart{width:16px;height:16px;background:var(--card);transform:rotate(45deg);position:relative;border-radius:2px;transition:background .4s}
.heart.on{background:var(--rose)}
.hearts{flex-direction:column;align-items:center;gap:8px}
.bar{width:100%;height:8px;border-radius:99px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose);border-radius:99px;transition:width .4s}
small{color:var(--soft);font-size:14px}
.opts{display:grid;gap:12px;margin-top:26px}
.opt{padding:16px 18px;border-radius:16px;background:var(--card);border:1.5px solid rgba(233,184,198,.25);font-size:17px;text-align:left;transition:background .2s,border-color .2s}
.opt:active{background:rgba(240,143,168,.2)}
.opt.bad{border-color:#ff8a8a;background:rgba(255,100,100,.15);animation:sh .35s}
.opt.good{border-color:var(--gold);background:rgba(232,194,122,.18)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{min-height:22px;margin:14px 0 0;font-size:15px}
.polaroid{background:var(--paper);color:var(--paper-ink);padding:12px 12px 20px;border-radius:6px;margin:6px auto 0;width:min(100%,320px);transform:rotate(-2deg);box-shadow:0 18px 40px rgba(0,0,0,.45);animation:pop .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:rotate(-8deg) scale(.6);opacity:0}}
.photo{aspect-ratio:1;background:linear-gradient(135deg,#f6c9d4,#e8a3b8);display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:2px}
.photo img,.photo video{width:100%;height:100%;object-fit:cover}
.photo span{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:22px;color:#7a2d52;padding:20px}
.phrase{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:23px;line-height:1.25;margin:16px 6px 0}
.hide{display:none}
.big{font-size:64px;margin:0 0 6px;color:var(--rose)}
@media (prefers-reduced-motion:reduce){.polaroid,.opt.bad{animation:none}}
</style>
</head>
<body>
<main>
  <section id="intro">
    <p class="big" aria-hidden="true">♥</p>
    <h1>Quanto você me conhece?</h1>
    <p>Cada resposta certa revela uma lembrança nossa. Vamos ver se você acerta todas?</p>
    <button class="btn" id="start">Começar</button>
  </section>

  <section id="quiz" class="hide">
    <div class="hearts" id="hearts" aria-label="Progresso"></div>
    <h2 id="q"></h2>
    <div class="opts" id="opts"></div>
    <p class="hint" id="hint" role="status"></p>
  </section>

  <section id="reveal" class="hide">
    <div class="polaroid">
      <div class="photo" id="photo"></div>
      <p class="phrase" id="phrase"></p>
    </div>
    <button class="btn" id="next">Próxima</button>
  </section>

  <section id="end" class="hide">
    <p class="big" aria-hidden="true">♥</p>
    <h1>Você acertou tudo!</h1>
    <p id="endmsg"></p>
  </section>
</main>

  {q:"Onde foi o nosso primeiro encontro?", o:["No cinema","Em um café","Na casa dela","Na praia"], c:2,
   frase:"Na sua casa eu já sabia: era você o meu lugar favorito.", photo:null},
  {q:"Quanto é 7 × 8?", o:["54","56","58","64"], c:1,
   frase:"Você acertou a conta, e eu acertei em te escolher.", photo:null},
  {q:"Se eu te dou 3 beijos de manhã e 4 à noite, quantos beijos por dia?", o:["6","7","8","9"], c:1,

const FRASES = ["Cada acerto seu me faz sorrir ainda mais.","Com você, até as contas ficam bonitas.","Você é a minha soma favorita.","Ao seu lado tudo se multiplica: a alegria, o carinho, o amor.","Eu divido tudo com você, menos o meu coração: ele é todo seu.","Seu abraço é o meu lugar de paz.","Você é a resposta de todas as minhas perguntas.","Meu dia melhora só de pensar em você.","Amar você é a coisa mais fácil que já fiz.","Seu sorriso ilumina até os meus dias nublados.","Se eu pudesse, parava o tempo nos seus braços.","Você é a minha pessoa favorita no mundo.","Todo caminho me leva até você.","Que bom ter você como o meu lar.","Meu coração aprendeu a bater no seu ritmo.","Você faz o simples virar especial.","Com você, qualquer lugar é o melhor lugar.","Eu escolheria você em todas as vidas.","Seu olhar é o meu poema preferido.","Nosso amor é a conta que sempre fecha.","Você é o meu presente todos os dias.","A saudade de você é a minha conta sem resultado.","Mais um acerto, mais um motivo para te amar.","Você é o sonho que virou realidade.","Contigo aprendi o que é amar de verdade.","Seu carinho é o meu cobertor nos dias frios.","Eu te amo mais do que consigo contar.","Você é infinita, assim como o que sinto por você.","Nada se compara ao seu abraço.","Você me completa como ninguém.","Que sorte a minha ter você.","Seu amor é o meu maior tesouro.","Cada momento ao seu lado vale ouro.","Você é a melhor parte de mim.","Eu te encontraria em qualquer universo.","Sua risada é a minha música favorita.","Com você, o amanhã sempre parece lindo.","Meu amor por você só cresce.","Você é o meu porto seguro.","Beijo seu é o meu vício bom.","Se amar fosse prova, eu tirava dez com você.","Você é a minha melhor escolha.","Cada dia ao seu lado é uma nova aventura.","Seu nome é a palavra mais bonita que eu conheço.","Eu sou feliz porque tenho você.","Juntos somos mais que a soma de nós dois.","Você é o meu pensamento favorito.","Meu mundo ficou mais colorido com você.","Eu amo cada detalhe seu.","Você é a razão do meu sorriso bobo.","Nossa história é a minha preferida.","Contigo, até o silêncio é bom.","Você faz o meu coração disparar.","Quero você hoje, amanhã e sempre.","Você é a minha calma e a minha alegria.","Com você aprendi que amar é ficar.","Quero você por perto, sempre.","Seu cheiro, seu abraço, seu jeito: tudo em você me encanta.","Você transforma dias comuns em memórias lindas.","Nós dois formamos o melhor resultado.","Falta pouco, mas o meu amor por você não tem fim.","Você é o meu para sempre.","O meu amor por você já passou de todos os limites.","A última pergunta acabou, mas o meu amor continua."];
const PERGUNTAS = (()=>{
  let s=7; const r=n=>{s=(s*9301+49297)%233280;return Math.floor(s/233280*n)};
  const shuf=a=>{for(let x=a.length-1;x>0;x--){const y=r(x+1);[a[x],a[y]]=[a[y],a[x]]}return a};
  const G=[
    ()=>{const a=10+r(90),b=10+r(90);return [`Quanto é ${a} + ${b}?`,a+b]},
    ()=>{const a=3+r(10),b=3+r(10);return [`Quanto é ${a} × ${b}?`,a*b]},
    ()=>{const a=60+r(90),b=10+r(40);return [`Quanto é ${a} − ${b}?`,a-b]},
    ()=>{const b=2+r(9),n=2+r(12);return [`Quanto é ${b*n} ÷ ${b}?`,n]},
    ()=>{const p=[10,20,25,50][r(4)],b=[40,60,80,120,200][r(5)];return [`Quanto é ${p}% de ${b}?`,p*b/100]},
    ()=>{const n=2+r(11);return [`Qual é a raiz quadrada de ${n*n}?`,n]},
    ()=>{const x=2+r(12),a=2+r(6),b=1+r(20);return [`Se ${a}x + ${b} = ${a*x+b}, quanto vale x?`,x]},
    ()=>{const a=2+r(8),b=2+r(8);return [`Se eu te dou ${a} beijos de manhã e ${b} à noite, quantos beijos por dia?`,a+b]}
  ];
  const seen=new Set(FIXAS.map(f=>f.q)), list=[...FIXAS];
  for(let k=0;k<FRASES.length;k++){
    let t,ans; do{[t,ans]=G[k%G.length]()}while(seen.has(t)); seen.add(t);
    const w=[]; for(const d of shuf([-10,-3,-2,-1,1,2,3,10])){if(ans+d>=0&&w.length<3)w.push(ans+d)}
    const o=shuf([ans,...w]);
    list.push({q:t,o:o.map(String),c:o.indexOf(ans),frase:FRASES[k],photo:null});
  }
  list.forEach((p,k)=>{if(FOTOS.length)p.photo=FOTOS[k%FOTOS.length]});
  const out=list.slice(0,12); out[11].frase=FRASES[FRASES.length-1];
  return out;
})();

const $=id=>document.getElementById(id);
const show=id=>["intro","quiz","reveal","end"].forEach(s=>$(s).classList.toggle("hide",s!==id));
let i=0;

function hearts(){
  $("hearts").innerHTML=`<div class="bar"><i style="width:${i/PERGUNTAS.length*100}%"></i></div><small>${i+1} de ${PERGUNTAS.length}</small>`;
}
function ask(){
  const p=PERGUNTAS[i];
  hearts();
  $("q").textContent=p.q;
  $("hint").textContent="";
  $("opts").innerHTML="";
  p.o.forEach((t,k)=>{
    const b=document.createElement("button");
    b.className="opt";b.textContent=t;
    b.onclick=()=>pick(b,k);
    $("opts").appendChild(b);
  });
  show("quiz");
}
function pick(b,k){
  const p=PERGUNTAS[i];
  if(k===p.c){
    b.classList.add("good");
    setTimeout(()=>{
      $("photo").innerHTML=p.photo?(p.photo.startsWith("data:video")?`<video src="${p.photo}" autoplay muted loop playsinline></video>`:`<img alt="Nossa foto" src="${p.photo}">`):`<span>Sua foto aparece aqui ♥</span>`;
      $("phrase").textContent="“"+p.frase+"”";
      $("next").textContent=i===PERGUNTAS.length-1?"Finalizar":"Próxima";
      show("reveal");
    },450);
  }else{
    b.classList.add("bad");b.disabled=true;
    $("hint").textContent="Quase! Tente de novo, "+NOME+".";
  }
}
$("start").onclick=ask;
$("next").onclick=()=>{
  i++;
  if(i>=PERGUNTAS.length){$("endmsg").textContent=MENSAGEM_FINAL;show("end");}
  else ask();
};
